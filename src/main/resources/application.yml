server:
  port: ${PORT:9090}

spring:
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

logging:
  level:
    com.example.demo.service.FacePlusService: DEBUG
    com.example.demo.service.MultiModelVibeService: DEBUG

face:
  api:
    key: ${FACEPP_API_KEY}
    secret: ${FACEPP_API_SECRET}

claude:
  api:
    key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-6

openai:
  api:
    key: ${OPENAI_API_KEY:}
    model: gpt-4o

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-2.5-pro
    fallbackModel: gemini-2.5-flash

fal:
  api:
    key: ${FAL_API_KEY:}

features:
  gpt-enabled: false
  gemini-enabled: false
  fal-enabled: false
